# 注意：本文件是针对具体服务器的部署配置，路径与端口需按实际环境修改。
# 通用/可移植的部署请优先使用 gunicorn_conf.py（支持环境变量覆盖）。
# 之所以保留绝对路径，是因为 uWSGI 无法为 chdir 提供"环境变量缺省值"，
# 改成相对路径会在启动目录不确定时直接启动失败。
[uwsgi]
#项目目录
chdir=/www/wwwroot/address_parse

#指定项目application
wsgi-file=/www/wwwroot/address_parse/app.py

#python 程序内用以启动的application 变量名
callable=app

# 进程个数
processes=4

# 线程个数
threads=2

#指定启动时的pid文件路径（用于停止服务和重启服务，请勿删除）
pidfile=/www/wwwroot/address_parse/uwsgi.pid

# 指定ip及端口
# 默认http模式，可切换至socket模式
http=0.0.0.0:6653
#socket=0.0.0.0:6653

#启动uwsgi的用户名和用户组
uid=www
gid=www

#启用主进程
master=true

# 设置缓冲区大小
buffer-size = 32768

# 后台运行,并输出日志
daemonize = /www/wwwlogs/python/address_parse/uwsgi.log

# 自定义设置项请写到该处, 
# 如果项目的启动方式您不想使用 wsgi-file 请注释掉,但不要删除，通讯方式(http, socket)同理;
# 最好以上面相同的格式 <注释 + 换行 + key = value> 进行书写，方便以后查阅

